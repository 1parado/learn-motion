<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learn Motion · 动效实验室</title>
  <meta name="description" content="收集并复刻优秀界面动效：弹簧、果冻、Morph、高亮跟随……" />
  <style>
    :root {
      --bg: #f4f4f5;
      --card: #ffffff;
      --ink: #18181b;
      --ink-2: #52525b;
      --ink-3: #a1a1aa;
      --line: rgba(0,0,0,.06);
      --accent: #4d6bfe;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.5;
    }

    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    header {
      margin-bottom: 40px;
    }
    header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }
    header p {
      font-size: 15px;
      color: var(--ink-2);
      max-width: 520px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      display: block;
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--line);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0,0,0,.08);
    }
    .card:active {
      transform: translateY(-1px) scale(.99);
    }

    .card-preview {
      height: 160px;
      background: linear-gradient(145deg, #eef0ff 0%, #f8f8fa 50%, #f0f4ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* 迷你预览：模拟果冻高亮条 */
    .mini-menu {
      width: 180px;
      background: #fff;
      border-radius: 10px;
      padding: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
      position: relative;
    }
    .mini-item {
      padding: 8px 10px;
      font-size: 12px;
      color: var(--ink-2);
      border-radius: 6px;
      position: relative;
      z-index: 1;
    }
    .mini-thumb {
      position: absolute;
      left: 6px;
      right: 6px;
      height: 32px;
      border-radius: 6px;
      background: rgba(119,119,119,.15);
      top: 6px;
      animation: thumb-slide 2.4s ease-in-out infinite;
    }
    @keyframes thumb-slide {
      0%, 20% { top: 6px; }
      40%, 60% { top: 42px; }
      80%, 100% { top: 78px; }
    }

    .card-body {
      padding: 16px 18px 18px;
    }
    .card-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      background: rgba(77,107,254,.08);
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 8px;
      letter-spacing: .02em;
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }
    .card-desc {
      font-size: 13px;
      color: var(--ink-2);
      line-height: 1.45;
    }

    .card.soon {
      opacity: .55;
      pointer-events: none;
    }
    .card.soon .card-preview {
      background: #f0f0f2;
    }
    .soon-label {
      font-size: 13px;
      color: var(--ink-3);
      font-weight: 500;
    }

    footer {
      margin-top: 56px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      color: var(--ink-3);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    footer a {
      color: var(--ink-2);
      text-decoration: none;
    }
    footer a:hover { color: var(--accent); }

    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
      .mini-thumb { animation: none; top: 42px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Learn Motion</h1>
      <p>复刻与拆解优秀界面动效。每个卡片是一个可交互 demo，点进去就能看、能摸。</p>
    </header>

    <div class="grid">
      <!-- 已上线 -->
      <a class="card" href="demos/果冻下拉菜单.html">
        <div class="card-preview">
          <div class="mini-menu">
            <div class="mini-thumb"></div>
            <div class="mini-item">Elon Musk</div>
            <div class="mini-item">Jensen Huang</div>
            <div class="mini-item">Sam Altman</div>
          </div>
        </div>
        <div class="card-body">
          <span class="card-tag">弹簧 · 高亮跟随</span>
          <div class="card-title">果冻下拉菜单</div>
          <div class="card-desc">阻尼弹簧采样 + 前后缘双弹簧，做出高亮条的果冻拉伸感。</div>
        </div>
      </a>

      <!-- 占位：后续可继续加 -->
      <div class="card soon">
        <div class="card-preview">
          <span class="soon-label">即将到来</span>
        </div>
        <div class="card-body">
          <span class="card-tag">待添加</span>
          <div class="card-title">更多动效</div>
          <div class="card-desc">高度 Morph、列表 FLIP、按压回弹……后续会陆续补上。</div>
        </div>
      </div>
    </div>

    <footer>
      <span>仿 DS Bot / 优秀产品动效 · 纯前端实现</span>
      <a href="https://github.com/1parado/learn-motion" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </div>
</body>
</html>
